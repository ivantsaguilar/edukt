services:
  db:
    image: postgres:15-alpine
    container_name: edukt_db
    environment:
      POSTGRES_USER: edukt_user
      POSTGRES_PASSWORD: edukt_password
      POSTGRES_DB: edukt_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edukt_user -d edukt_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: edukt_backend
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgres://edukt_user:edukt_password@db:5432/edukt_db
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: edukt_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data: